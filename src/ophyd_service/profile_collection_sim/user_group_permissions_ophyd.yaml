user_groups:
  root:  # Defines the rules for preliminary filtering of plan/device/function names for all groups.
    allowed_devices_read:
      - null  # Allow all
    forbidden_devices_read:
      - ":^_:?.*"  # All devices with names starting with '_'
    allowed_devices_write_idle:
      - null
    allowed_devices_write_always:
      - null
  primary:  # Default group. The group can be renamed or other groups may be created.
    allowed_devices_read:
      - null  # Allow all
    forbidden_devices_read:
      - ":^rand_async_device4:?.*"  # rand_async_device4 and it's components
      - ":^forbidden_motor:?.*"
      # - "sim_stage_async.x"  # Block only 'sim_stage_async.x', not it's components.
    allowed_devices_write_idle:
      - null
    # Devices allowed for writing are also readable, so read-blocked devices are blocked here too.
    forbidden_devices_write_idle:
      - ":^motor_no_write:?.*"
      - ":^sim_periodic_device_no_write:?.*"
      - ":^rand_async_device4:?.*"
      - ":^forbidden_motor:?.*"
    allowed_devices_write_always:
      - null
    forbidden_devices_write_always:
      - ":^motor_no_write:?.*"
      - ":^sim_periodic_device_no_write:?.*"
      - ":^rand_async_device4:?.*"
      - ":^forbidden_motor:?.*"
  test_user:  # Another group used for unit tests.
    allowed_devices_read:
      - null  # Allow all
    allowed_devices_write_idle:
      - null
    allowed_devices_write_always:
      - null
